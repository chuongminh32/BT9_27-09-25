spring.application.name=spring-boot-graphql-shop


# H2 + JPA
spring.datasource.url=jdbc:sqlserver://MINH-CHUONG:1433;databaseName=testdb;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=2357
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect


# GraphQL endpoint
spring.graphql.path=/graphql
spring.graphql.schema.locations=classpath:graphql/


# Bật GraphiQL UI (yêu cầu webjars:graphiql)
spring.graphql.graphiql.enabled=true
spring.web.resources.add-mappings=true