<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
<h2>Register</h2>
<form th:action="@{/register}" th:object="${user}" method="post">
    <div class="mb-3">
        <label>Fullname</label>
        <input type="text" th:field="*{fullname}" class="form-control"/>
        <small class="text-danger" th:errors="*{fullname}"></small>
    </div>
    <div class="mb-3">
        <label>Email</label>
        <input type="text" th:field="*{email}" class="form-control"/>
        <small class="text-danger" th:errors="*{email}"></small>
    </div>
    <div class="mb-3">
        <label>Password</label>
        <input type="password" th:field="*{password}" class="form-control"/>
        <small class="text-danger" th:errors="*{password}"></small>
    </div>
    <div class="mb-3">
        <label>Phone</label>
        <input type="text" th:field="*{phone}" class="form-control"/>
        <small class="text-danger" th:errors="*{phone}"></small>
    </div>
    <button type="submit" class="btn btn-success">Register</button>
</form>
</body>
</html>
