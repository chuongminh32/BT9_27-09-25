<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm / Sửa sản phẩm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<h2>Thêm / Sửa sản phẩm</h2>

<form th:action="@{/admin/products/save}" th:object="${product}" method="post">
    <div class="mb-3">
        <label class="form-label">Tên sản phẩm</label>
        <input type="text" th:field="*{title}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Số lượng</label>
        <input type="number" th:field="*{quantity}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea th:field="*{desc}" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Danh mục</label>
        <select th:field="*{categoryId}" class="form-select">
    <option th:each="c : ${categories}"
            th:value="${c.id}"
            th:text="${c.name}">
    </option>
</select>

    </div>

    <button type="submit" class="btn btn-success">Lưu</button>
    <a href="/admin/products" class="btn btn-secondary">Hủy</a>
</form>

</body>
</html>
